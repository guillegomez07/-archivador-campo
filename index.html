<body>
<div id="app"></div>

<script>
const ICONS = {
  pin: '<path d="M12 2C8 2 5 5 5 9c0 5.5 7 13 7 13s7-7.5 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.3"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2l-2 5.6-5.6 2 2-5.6z"/>',
  wrench: '<path d="M14.7 6.3a4 4 0 00-5.4 5l-6 6a1.4 1.4 0 002 2l6-6a4 4 0 005-5.4l-2.3 2.3-2-2z"/>',
  bolt: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  tree: '<path d="M12 2 6 10h3l-5 7h5v5h6v-5h5l-5-7h3z"/>',
  drop: '<path d="M12 2s6 7.5 6 12a6 6 0 01-12 0c0-4.5 6-12 6-12z"/>',
  flag: '<path d="M5 3v18M5 4h11l-2.5 4L16 12H5"/>',
  mountain: '<path d="M3 19 9 8l4 6 2-3 6 8z"/>',
  building: '<rect x="5" y="3" width="14" height="18"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>',
  camera: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7l1.5-2.5h3L15 7"/><circle cx="12" cy="13.5" r="3.2"/>'
};
const ICON_KEYS = Object.keys(ICONS);
function iconSvg(key, size=18, strokeW=1.8){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||ICONS.pin}</svg>`;
}
const COLORS = [
  {key:'accent', hex:'#2F5A73'},
  {key:'mustard', hex:'#C79A2B'},
  {key:'moss', hex:'#5C7A5E'},
  {key:'rust', hex:'#A6412B'},
  {key:'slate', hex:'#5A6570'},
  {key:'plum', hex:'#6B4E71'}
];
function colorHex(key){ const c = COLORS.find(c=>c.key===key); return c ? c.hex : '#2F5A73'; }

let state = {
  loading: true,
  refs: [],
  photosByRef: {},
  loadingPhotos: false,
  view: 'list',
  activeRefId: null,
  search: '',
  showNewSheet: false,
  showEditSheet: false,
  editingId: null,
  form: {name:'', date:'', place:'', icon:'pin', color:'accent'},
  saving: false,
  formError: '',
  lightboxPhoto: null,
  toast: ''
};

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function slug(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'').slice(0,40) || 'SinDato';
}

/* ---------- Almacenamiento local del dispositivo (IndexedDB) ---------- */
let dbPromise = null;
let videoObjectUrls = {};
function getVideoObjectUrl(photo){
  if(!photo.blob) return '';
  if(!videoObjectUrls[photo.id]){
    videoObjectUrls[photo.id] = URL.createObjectURL(photo.blob);
  }
  return videoObjectUrls[photo.id];
}
function revokeVideoObjectUrl(photoId){
  if(videoObjectUrls[photoId]){
    URL.revokeObjectURL(videoObjectUrls[photoId]);
    delete videoObjectUrls[photoId];
  }
}
function openDb(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open('archivador-campo-db', 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('refs')) db.createObjectStore('refs', {keyPath:'id'});
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', {keyPath:'id'}).createIndex('refId','refId',{unique:false});
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function idbGetAll(storeName, indexName, indexValue){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName,'readonly');
    const store = tx.objectStore(storeName);
    const source = indexName ? store.index(indexName) : store;
    const req = indexValue!==undefined ? source.getAll(indexValue) : source.getAll();
    req.onsuccess = ()=> resolve(req.result||[]);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPut(storeName, value){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName,'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbDelete(storeName, id){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName,'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbDeleteByIndex(storeName, indexName, indexValue){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName,'readwrite');
    const store = tx.objectStore(storeName);
    const idx = store.index(indexName);
    const req = idx.openCursor(IDBKeyRange.only(indexValue));
    req.onsuccess = ()=>{
      const cursor = req.result;
      if(cursor){ store.delete(cursor.primaryKey); cursor.continue(); }
    };
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

async function loadRefs(){
  state.loading = true; render();
  try{
    const list = await idbGetAll('refs');
    state.refs = list.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
  }catch(e){
    state.refs = [];
    showToast('No se pudo leer el almacenamiento local del dispositivo.');
  }
  state.loading = false;
  render();
}

async function saveRef(ref){
  try{
    await idbPut('refs', ref);
  }catch(e){
    showToast('No se pudo guardar en el dispositivo. Intenta de nuevo.');
  }
}

async function loadPhotos(refId){
  state.loadingPhotos = true; render();
  try{
    const list = await idbGetAll('photos','refId',refId);
    state.photosByRef[refId] = list.sort((a,b)=>a.ts-b.ts);
  }catch(e){
    state.photosByRef[refId] = [];
  }
  state.loadingPhotos = false;
  render();
}

async function savePhotoRecord(photo){
  try{
    await idbPut('photos', photo);
  }catch(e){
    showToast('No se pudo guardar la miniatura en el dispositivo.');
  }
}

/* Descarga el archivo original (calidad completa) a la carpeta de Descargas del celular */
function downloadOriginalFile(file, filename){
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=''; render(); }, 2200);
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxDim = 1000;
      let {width,height} = img;
      if(width>height && width>maxDim){ height=height*(maxDim/width); width=maxDim; }
      else if(height>maxDim){ width=width*(maxDim/height); height=maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,width,height);
      resolve(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function videoExt(mime){
  if(!mime) return 'mp4';
  if(mime.includes('quicktime')) return 'mov';
  if(mime.includes('webm')) return 'webm';
  if(mime.includes('3gpp')) return '3gp';
  return 'mp4';
}

function videoPlaceholderDataUrl(){
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 300;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#2A322F';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.moveTo(canvas.width/2-30, canvas.height/2-45);
  ctx.lineTo(canvas.width/2-30, canvas.height/2+45);
  ctx.lineTo(canvas.width/2+45, canvas.height/2);
  ctx.closePath();
  ctx.fill();
  return canvas.toDataURL('image/jpeg', 0.7);
}

function captureVideoThumbnail(file){
  return new Promise((resolve)=>{
    const video = document.createElement('video');
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;
    let settled = false;
    const url = URL.createObjectURL(file);
    video.src = url;
    const finish = (dataUrl)=>{
      if(settled) return;
      settled = true;
      clearTimeout(fallbackTimer);
      URL.revokeObjectURL(url);
      resolve(dataUrl);
    };
    const fallbackTimer = setTimeout(()=> finish(videoPlaceholderDataUrl()), 4000);
    video.onloadedmetadata = () => {
      const d = video.duration;
      const seekTime = (isFinite(d) && d>0) ? Math.min(0.5, d/2) : 0.1;
      try{ video.currentTime = seekTime; }catch(e){ finish(videoPlaceholderDataUrl()); }
    };
    video.onseeked = () => {
      try{
        const maxDim = 1000;
        let w = video.videoWidth||640, h = video.videoHeight||360;
        if(w>h && w>maxDim){ h = h*(maxDim/w); w = maxDim; }
        else if(h>maxDim){ w = w*(maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, w, h);
        finish(canvas.toDataURL('image/jpeg', 0.6));
      }catch(e){ finish(videoPlaceholderDataUrl()); }
    };
    video.onerror = () => finish(videoPlaceholderDataUrl());
  });
}

async function handleMediaFiles(refId, fileList){
  const files = Array.from(fileList);
  if(!files.length) return;
  const ref = state.refs.find(r=>r.id===refId);
  const hasVideo = files.some(f=>(f.type||'').startsWith('video/'));
  const hasPhoto = files.some(f=>!(f.type||'').startsWith('video/'));
  let startLabel;
  if(hasVideo && hasPhoto) startLabel = 'Guardando archivos en el dispositivo...';
  else if(hasVideo) startLabel = files.length>1 ? 'Guardando videos en el dispositivo...' : 'Guardando video en el dispositivo...';
  else startLabel = files.length>1 ? 'Guardando fotos en el dispositivo...' : 'Guardando foto en el dispositivo...';
  showToast(startLabel);
  if(!state.photosByRef[refId]) state.photosByRef[refId] = [];
  const existingCount = state.photosByRef[refId].length;
  let i = 0;
  for(const file of files){
    i++;
    const isVideo = (file.type||'').startsWith('video/');
    try{
      let record;
      if(isVideo){
        const thumbUrl = await captureVideoThumbnail(file);
        const ext = videoExt(file.type);
        const filename = `${slug(ref.name)}_${ref.date}_${slug(ref.place)}_${existingCount+i}.${ext}`;
        record = {id:uid(), refId, type:'video', dataUrl:thumbUrl, blob:file, ts:Date.now(), filename};
      } else {
        const thumbUrl = await compressImage(file);
        const ext = (file.type && file.type.includes('png')) ? 'png' : 'jpg';
        const filename = `${slug(ref.name)}_${ref.date}_${slug(ref.place)}_${existingCount+i}.${ext}`;
        record = {id:uid(), refId, type:'photo', dataUrl:thumbUrl, ts:Date.now(), filename};
      }
      state.photosByRef[refId].push(record);
      await savePhotoRecord(record);
      downloadOriginalFile(file, record.filename);
    }catch(e){ /* omitir archivo con error */ }
  }
  render();
  let endLabel;
  if(hasVideo && hasPhoto) endLabel = 'Archivos guardados en Descargas';
  else if(hasVideo) endLabel = files.length>1 ? 'Videos guardados en Descargas' : 'Video guardado en Descargas';
  else endLabel = files.length>1 ? 'Fotos guardadas en Descargas' : 'Foto guardada en Descargas';
  showToast(endLabel);
}

async function submitNewRef(){
  if(!state.form.name.trim()){ state.formError='Ingresa un nombre o código de referencia.'; render(); return; }
  state.saving = true; render();
  const ref = {
    id: uid(),
    name: state.form.name.trim(),
    date: state.form.date || todayISO(),
    place: state.form.place.trim(),
    icon: state.form.icon,
    color: state.form.color,
    createdAt: Date.now()
  };
  state.refs.unshift(ref);
  await saveRef(ref);
  state.saving = false;
  state.showNewSheet = false;
  render();
}

async function submitEditRef(){
  if(!state.form.name.trim()){ state.formError='Ingresa un nombre o código de referencia.'; render(); return; }
  state.saving = true; render();
  const idx = state.refs.findIndex(r=>r.id===state.editingId);
  if(idx>-1){
    state.refs[idx] = {...state.refs[idx], name:state.form.name.trim(), date:state.form.date, place:state.form.place.trim(), icon:state.form.icon, color:state.form.color};
    await saveRef(state.refs[idx]);
  }
  state.saving = false;
  state.showEditSheet = false;
  render();
}

async function deleteRef(refId){
  (state.photosByRef[refId]||[]).forEach(p=>{ if(p.type==='video') revokeVideoObjectUrl(p.id); });
  state.refs = state.refs.filter(r=>r.id!==refId);
  await idbDelete('refs', refId);
  await idbDeleteByIndex('photos','refId',refId);
  delete state.photosByRef[refId];
  state.view = 'list';
  state.activeRefId = null;
  render();
  showToast('Referencia eliminada del dispositivo (las fotos ya descargadas permanecen en tu carpeta de Descargas)');
}

async function deletePhoto(refId, photoId){
  revokeVideoObjectUrl(photoId);
  state.photosByRef[refId] = (state.photosByRef[refId]||[]).filter(p=>p.id!==photoId);

  await idbDelete('photos', photoId);
}

function buildRefSummaryText(ref, itemCount){
  return `Referencia: ${ref.name}\nFecha: ${fmtDate(ref.date)}\nLugar: ${ref.place||'-'}\nFotos y videos registrados: ${itemCount}`;
}
function buildFullExportText(){
  if(!state.refs.length) return 'Archivador de Campo: aún no hay referencias registradas.';
  const lines = state.refs.map(r=>{
    const count = state.photosByRef[r.id] ? state.photosByRef[r.id].length : '?';
    return `• ${r.name} — ${fmtDate(r.date)}${r.place?` — ${r.place}`:''} — ${count} archivo(s)`;
  });
  return `Archivador de Campo — registro de referencias\n\n${lines.join('\n')}`;
}

async function dataUrlToFile(dataUrl, filename){
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  return new File([blob], filename, {type: blob.type || 'image/jpeg'});
}

async function shareRefContent(ref){
  const items = state.photosByRef[ref.id] || [];
  const text = buildRefSummaryText(ref, items.length);
  let files = [];
  try{
    files = await Promise.all(items.slice(0,15).map(p =>
      (p.type==='video' && p.blob)
        ? Promise.resolve(new File([p.blob], p.filename || (p.id+'.mp4'), {type: p.blob.type || 'video/mp4'}))
        : dataUrlToFile(p.dataUrl, p.filename || (p.id+'.jpg'))
    ));
  }catch(e){ files = []; }
  await shareContent(text, files, items.length>15);
}

async function shareContent(text, files, truncated){
  const fullText = truncated ? text+'\n\n(Se comparten solo los primeros 15 archivos.)' : text;
  if(navigator.share){
    try{
      const shareData = {text: fullText};
      if(files && files.length && navigator.canShare && navigator.canShare({files})){
        shareData.files = files;
      }
      await navigator.share(shareData);
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
    }
  }
  state.shareFallbackText = fullText;
  render();
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(){
  const app = document.getElementById('app');
  let html = state.view==='list' ? renderListView() : renderDetailView();
  html += renderSheet();
  html += renderLightbox();
  html += renderShareFallback();
  if(state.toast) html += `<div class="toast">${escapeHtml(state.toast)}</div>`;
  app.innerHTML = html;
  bindEvents();
}

function bindEvents(){
  const app = document.getElementById('app');

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', e=>{ state.search = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(state.search.length,state.search.length); });
  }
  const fab = document.getElementById('fabAdd');
  if(fab) fab.addEventListener('click', openNewSheet);

  const exportAllBtn = document.getElementById('exportAllBtn');
  if(exportAllBtn) exportAllBtn.addEventListener('click', ()=> shareContent(buildFullExportText(), [], false));

  app.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openRef(el.getAttribute('data-open')));
  });

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', goList);

  const shareRefBtn = document.getElementById('shareRefBtn');
  if(shareRefBtn) shareRefBtn.addEventListener('click', ()=>{
    const ref = state.refs.find(r=>r.id===state.activeRefId);
    if(ref) shareRefContent(ref);
  });

  const editBtn = document.getElementById('editRefBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    const ref = state.refs.find(r=>r.id===state.activeRefId);
    if(ref) openEditSheet(ref);
  });
  const delBtn = document.getElementById('deleteRefBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(confirm('¿Eliminar esta referencia y todas sus fotos? Esta acción no se puede deshacer.')){
      deleteRef(state.activeRefId);
    }
  });

  const takePhotoBtn = document.getElementById('takePhotoBtn');
  const cameraInput = document.getElementById('cameraInput');
  if(takePhotoBtn) takePhotoBtn.addEventListener('click', ()=> cameraInput.click());
  if(cameraInput) cameraInput.addEventListener('change', e=>{
    if(e.target.files.length) handleMediaFiles(state.activeRefId, e.target.files);
    e.target.value='';
  });
  const takeVideoBtn = document.getElementById('takeVideoBtn');
  const videoCameraInput = document.getElementById('videoCameraInput');
  if(takeVideoBtn) takeVideoBtn.addEventListener('click', ()=> videoCameraInput.click());
  if(videoCameraInput) videoCameraInput.addEventListener('change', e=>{
    if(e.target.files.length) handleMediaFiles(state.activeRefId, e.target.files);
    e.target.value='';
  });
  const uploadPhotoBtn = document.getElementById('uploadPhotoBtn');
  const galleryInput = document.getElementById('galleryInput');
  if(uploadPhotoBtn) uploadPhotoBtn.addEventListener('click', ()=> galleryInput.click());
  if(galleryInput) galleryInput.addEventListener('change', e=>{
    if(e.target.files.length) handleMediaFiles(state.activeRefId, e.target.files);
    e.target.value='';
  });

  app.querySelectorAll('[data-photo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pid = el.getAttribute('data-photo');
      const list = orderedPhotos(state.activeRefId);
      const idx = list.findIndex(p=>p.id===pid);
      if(idx>-1){ state.lightboxPhoto = {refId:state.activeRefId, index:idx}; render(); }
    });
  });

  // Sheet
  const overlay = document.getElementById('sheetOverlay');
  if(overlay){
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSheets(); });
    document.getElementById('fName').addEventListener('input', e=>{ state.form.name=e.target.value; });
    document.getElementById('fDate').addEventListener('input', e=>{ state.form.date=e.target.value; });
    document.getElementById('fPlace').addEventListener('input', e=>{ state.form.place=e.target.value; });
    app.querySelectorAll('[data-icon]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.form.icon = el.getAttribute('data-icon'); render(); refocusSheetInputs(); });
    });
    app.querySelectorAll('[data-color]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.form.color = el.getAttribute('data-color'); render(); refocusSheetInputs(); });
    });
    document.getElementById('cancelSheet').addEventListener('click', closeSheets);
    document.getElementById('submitSheet').addEventListener('click', ()=>{
      state.showEditSheet ? submitEditRef() : submitNewRef();
    });
  }

  // Share fallback
  const shareOverlay = document.getElementById('shareOverlay');
  if(shareOverlay){
    shareOverlay.addEventListener('click', e=>{ if(e.target===shareOverlay){ state.shareFallbackText=''; render(); } });
    document.getElementById('closeShareFallback').addEventListener('click', ()=>{ state.shareFallbackText=''; render(); });
    document.getElementById('copyShareText').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(state.shareFallbackText);
        showToast('Texto copiado');
      }catch(e){
        showToast('No se pudo copiar automáticamente. Selecciona el texto manualmente.');
      }
    });
  }

  // Lightbox
  const lb = document.getElementById('lightboxOverlay');
  if(lb){
    document.getElementById('lbClose').addEventListener('click', ()=>{ state.lightboxPhoto=null; render(); });
    document.getElementById('lbDelete').addEventListener('click', ()=>{
      if(confirm('¿Eliminar esta foto?')){
        const {refId, index} = state.lightboxPhoto;
        const list = orderedPhotos(refId);
        const photo = list[index];
        const nextIndex = index >= list.length-1 ? index-1 : index;
        deletePhoto(refId, photo.id).then(()=>{
          const newList = orderedPhotos(refId);
          if(newList.length===0){ state.lightboxPhoto=null; }
          else { state.lightboxPhoto = {refId, index: Math.max(0, Math.min(nextIndex, newList.length-1))}; }
          render();
        });
      }
    });
    const prevBtn = document.getElementById('lbPrev');
    const nextBtn = document.getElementById('lbNext');
    const goPrev = ()=>{
      const {refId, index} = state.lightboxPhoto;
      if(index>0){ state.lightboxPhoto = {refId, index:index-1}; render(); }
    };
    const goNext = ()=>{
      const {refId, index} = state.lightboxPhoto;
      const list = orderedPhotos(refId);
      if(index<list.length-1){ state.lightboxPhoto = {refId, index:index+1}; render(); }
    };
    if(prevBtn) prevBtn.addEventListener('click', goPrev);
    if(nextBtn) nextBtn.addEventListener('click', goNext);

    // Deslizar con el pulgar para pasar de foto
    const imgWrap = document.getElementById('lbImgWrap');
    if(imgWrap){
      let startX=0, startY=0, tracking=false;
      imgWrap.addEventListener('touchstart', e=>{
        if(e.touches.length!==1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        tracking = true;
      }, {passive:true});
      imgWrap.addEventListener('touchend', e=>{
        if(!tracking) return;
        tracking = false;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const dx = endX - startX;
        const dy = endY - startY;
        if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5){
          if(dx < 0) goNext(); else goPrev();
        }
      }, {passive:true});
    }
  }
}

function refocusSheetInputs(){}

loadRefs();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
